name: Aggregate OLX

on:
  schedule:
    # Запускати кожні 30 хвилин (мінімальний інтервал GitHub — 5 хвилин)
    - cron: '*/30 * * * *'
  workflow_dispatch:  # Дозволяє запускати вручну з вкладки Actions

jobs:
  aggregate:
    runs-on: ubuntu-latest  # IP-адреси Azure, спробуємо їх
    timeout-minutes: 30     # Запобіжник від зациклення

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run aggregation
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_IDS: ${{ secrets.ADMIN_CHAT_IDS }}
        run: python scripts/run_cycle_manual.py
