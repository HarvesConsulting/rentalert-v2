name: Aggregate OLX

on:
  # GitHub schedule ненадійний на free tier — використовуємо repository_dispatch
  # з cron-job.org
  repository_dispatch:
    types: [aggregate]
  workflow_dispatch:
    inputs:
      city_slug:
        description: 'Місто для парсингу (необов’язково — якщо порожньо, всі міста)'
        required: false
        type: string

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run aggregation
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_IDS: ${{ secrets.ADMIN_CHAT_IDS }}
          CITY_SLUG: ${{ inputs.city_slug }}
        run: python scripts/run_cycle_manual.py
