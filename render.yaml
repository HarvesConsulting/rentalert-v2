services:
  - type: web
    name: rentalert-v2
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: |
      pip install --upgrade pip
      pip install -e .
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 "rentalert.app:app"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: DIMRIA_API_KEY
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO
