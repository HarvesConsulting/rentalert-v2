services:
  - type: web
    name: rentalert-v2
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: DIMRIA_API_KEY
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO
